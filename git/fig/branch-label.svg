  <line x1="430" y1="49" x2="430" y2="67" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="406.6" y="25" width="46.8" height="24" rx="6" fill="#333333"/>
  <text x="430" y="41.5" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HEAD</text>
