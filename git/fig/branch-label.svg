<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img">
  <title>A branch is a label pointing at a commit</title>
  <desc>Three commits in a row: 005937f, 35e8622 and 1e6da70. The main branch label points at 35e8622. The moons branch label points at the newer commit 1e6da70, and HEAD is attached to moons, meaning moons is the current branch.</desc>
