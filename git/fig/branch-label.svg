  <line x1="163" y1="122" x2="277" y2="122" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="303" y1="122" x2="417" y2="122" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="122" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
