  <circle cx="290" cy="122" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="290" y="157" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">35e8622</text>
  <circle cx="430" cy="122" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="430" y="157" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">1e6da70</text>
  <line x1="290" y1="91" x2="290" y2="109" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="266.6" y="67" width="46.8" height="24" rx="6" fill="#0072B2"/>
  <text x="290" y="83.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <line x1="430" y1="91" x2="430" y2="109" stroke="#E69F00" stroke-width="2.5" stroke-linecap="round"/>
