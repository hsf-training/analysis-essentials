<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img">
  <title>The Owner, GitLab and the Collaborator each have a copy of the repository</title>
  <desc>Three copies of the planets repository, each with the same three commits and main branch. On the left, the Owner's computer (~/planets), which pushed the commits to CERN GitLab with git push. In the middle, the repository vlad/planets on CERN GitLab. On the right, the Collaborator's computer (~/Desktop/vlad-planets), which got its copy with git clone.</desc>
  <rect width="900" height="250" fill="#FFFFFF"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#444444"/></marker></defs>
  <rect x="20" y="44" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
  <rect x="20" y="44" width="240" height="30" rx="10" fill="#009E73"/>
  <rect x="20" y="64" width="240" height="10" fill="#009E73"/>
  <text x="140.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Owner's computer</text>
  <text x="140.0" y="96" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">~/planets</text>
  <line x1="63" y1="142" x2="83" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="109" y1="142" x2="129" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="96" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="142" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="155" y1="142" x2="171" y2="142" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="171" y="130" width="50" height="24" rx="6" fill="#0072B2"/>
  <text x="196" y="146.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <rect x="340" y="14" width="222" height="206" rx="14" fill="#F4F7FB" stroke="#DCE3EC" stroke-width="1.5"/>
  <text x="354" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B6B6B" text-anchor="start">CERN GitLab</text>
  <rect x="354" y="44" width="194" height="150" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
  <rect x="354" y="44" width="194" height="30" rx="10" fill="#0072B2"/>
  <rect x="354" y="64" width="194" height="10" fill="#0072B2"/>
  <text x="451.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Shared repository</text>
  <text x="451.0" y="96" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">vlad/planets</text>
  <line x1="383" y1="142" x2="397" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
