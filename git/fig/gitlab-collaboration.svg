  <circle cx="450" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="463" y1="142" x2="479" y2="142" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="479" y="130" width="50" height="24" rx="6" fill="#0072B2"/>
