  <line x1="685" y1="142" x2="705" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="731" y1="142" x2="751" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
