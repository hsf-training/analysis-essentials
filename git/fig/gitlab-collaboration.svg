  <rect x="793" y="130" width="50" height="24" rx="6" fill="#0072B2"/>
  <text x="818" y="146.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <line x1="266" y1="119" x2="334" y2="119" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300.0" y="109" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">git push</text>
  <line x1="554" y1="119" x2="636" y2="119" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="595.0" y="109" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">git clone</text>
