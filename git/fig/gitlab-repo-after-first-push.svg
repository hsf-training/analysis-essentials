<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img">
  <title>The local and remote repositories after the first push</title>
  <desc>On the left, your computer: the planets repository in ~/planets, with three commits and the main branch. On the right, on CERN GitLab, the repository vlad/planets now contains the same three commits and main branch, because git push -u origin main has copied them there. In the local repository, the remote called origin points to ssh://git@gitlab.cern.ch:7999/vlad/planets.git.</desc>
  <rect width="720" height="270" fill="#FFFFFF"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#444444"/></marker></defs>
  <rect x="20" y="44" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
  <rect x="20" y="44" width="270" height="30" rx="10" fill="#009E73"/>
  <rect x="20" y="64" width="270" height="10" fill="#009E73"/>
  <text x="155.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your computer</text>
  <text x="155.0" y="96" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">~/planets</text>
  <line x1="75" y1="142" x2="95" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="121" y1="142" x2="141" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="108" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="154" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="167" y1="142" x2="183" y2="142" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="183" y="130" width="50" height="24" rx="6" fill="#0072B2"/>
  <text x="208" y="146.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <rect x="410" y="14" width="296" height="206" rx="14" fill="#F4F7FB" stroke="#DCE3EC" stroke-width="1.5"/>
  <text x="424" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B6B6B" text-anchor="start">CERN GitLab</text>
  <rect x="426" y="44" width="264" height="150" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
  <rect x="426" y="44" width="264" height="30" rx="10" fill="#0072B2"/>
  <rect x="426" y="64" width="264" height="10" fill="#0072B2"/>
  <text x="558.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Repository on GitLab</text>
  <text x="558.0" y="96" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">vlad/planets</text>
  <line x1="478" y1="142" x2="498" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="524" y1="142" x2="544" y2="142" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="465" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="511" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <circle cx="557" cy="142" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="570" y1="142" x2="586" y2="142" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="586" y="130" width="50" height="24" rx="6" fill="#0072B2"/>
  <text x="611" y="146.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <line x1="298" y1="119" x2="418" y2="119" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="358.0" y="93" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">git push</text>
  <text x="358.0" y="109" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">-u origin main</text>
  <text x="360" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B6B" text-anchor="middle"><tspan font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#1A1A1A">origin</tspan> = <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#1A1A1A">ssh://git@gitlab.cern.ch:7999/vlad/planets.git</tspan></text>
</svg>
