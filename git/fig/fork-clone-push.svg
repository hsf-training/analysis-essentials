<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img">
  <title>The three copies of a repository in a merge request workflow</title>
  <desc>On CERN GitLab there are two copies of the project: the original repository (starter-kit-scratch/starter-kit-example) and your fork (YOUR_CERN_USERNAME/starter-kit-example). Your computer holds a third copy, a local clone. Step 1: fork the original repository on GitLab. Step 2: git clone the original repository to your computer, where it is the remote called origin; later, git pull from origin keeps it up to date. Step 3: git push your branch to your fork, the remote named after your username. Step 4: open a merge request from your fork back to the original repository.</desc>
  <rect width="700" height="430" fill="#FFFFFF"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#444444"/></marker><marker id="arrow-mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0072B2"/></marker></defs>
  <rect x="16" y="14" width="668" height="200" rx="14" fill="#F4F7FB" stroke="#DCE3EC" stroke-width="1.5"/>
  <text x="34" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B6B6B" text-anchor="start">CERN GitLab</text>
  <rect x="34" y="58" width="250" height="94" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
  <rect x="34" y="58" width="250" height="30" rx="10" fill="#0072B2"/>
  <rect x="34" y="78" width="250" height="10" fill="#0072B2"/>
  <text x="159.0" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Original repository</text>
  <text x="159.0" y="110" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">starter-kit-scratch/</text>
  <text x="159.0" y="128" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">starter-kit-example</text>
  <rect x="416" y="58" width="250" height="94" rx="10" fill="#FFFFFF" stroke="#E69F00" stroke-width="2.5"/>
  <rect x="416" y="58" width="250" height="30" rx="10" fill="#E69F00"/>
  <rect x="416" y="78" width="250" height="10" fill="#E69F00"/>
  <text x="541.0" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Your fork</text>
  <text x="541.0" y="110" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">YOUR_CERN_USERNAME/</text>
  <text x="541.0" y="128" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">starter-kit-example</text>
  <rect x="225" y="300" width="250" height="94" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
  <rect x="225" y="300" width="250" height="30" rx="10" fill="#009E73"/>
  <rect x="225" y="320" width="250" height="10" fill="#009E73"/>
  <text x="350.0" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your computer</text>
  <text x="350.0" y="352" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1A1A1A" text-anchor="middle">local clone, on the branch</text>
  <text x="350.0" y="370" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="middle">add-YOUR_CERN_USERNAME</text>
  <line x1="290" y1="88" x2="410" y2="88" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="350" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1A1A1A" text-anchor="middle"><tspan font-weight="bold">1.</tspan> Fork</text>
  <line x1="410" y1="128" x2="290" y2="128" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-mr)"/>
  <text x="350" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#0072B2" text-anchor="middle"><tspan font-weight="bold">4.</tspan> merge request</text>
  <line x1="150" y1="158" x2="262" y2="294" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="118" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1A1A1A" text-anchor="middle"><tspan font-weight="bold">2.</tspan> git clone</text>
  <text x="118" y="249" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" fill="#6B6B6B" text-anchor="middle">(later: git pull)</text>
  <text x="210" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="end">remote: <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#1A1A1A">origin</tspan></text>
  <line x1="438" y1="294" x2="550" y2="158" stroke="#444444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="584" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1A1A1A" text-anchor="middle"><tspan font-weight="bold">3.</tspan> git push</text>
  <text x="490" y="284" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">remote: <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#1A1A1A">YOUR_CERN_USERNAME</tspan></text>
</svg>
