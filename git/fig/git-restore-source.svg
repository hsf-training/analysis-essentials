<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img">
  <title>Restoring an older version of a file</title>
  <desc>The repository contains three commits: f22b25e (HEAD~2), 34961b1 (HEAD~1) and 005937f (HEAD, the latest commit on main). The command git restore --source=f22b25e mars.txt takes mars.txt as it was in commit f22b25e and puts it in the working directory, where it contains only the first line, "Cold and dry, but everything is my favorite color".</desc>
  <rect width="620" height="330" fill="#FFFFFF"/>
  <defs><marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#444444"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D55E00"/></marker></defs>
  <rect x="16" y="14" width="588" height="150" rx="10" fill="#EEF5FB" stroke="#0072B2" stroke-width="2"/>
  <text x="310.0" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Repository (.git)</text>
  <line x1="153" y1="92" x2="287" y2="92" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <line x1="313" y1="92" x2="447" y2="92" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="92" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="140" y="125" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">f22b25e</text>
  <text x="140" y="67" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#6B6B6B" text-anchor="middle">HEAD~2</text>
  <circle cx="300" cy="92" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="300" y="125" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">34961b1</text>
  <text x="300" y="67" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#6B6B6B" text-anchor="middle">HEAD~1</text>
  <circle cx="460" cy="92" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="460" y="125" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1A1A1A" text-anchor="middle">005937f</text>
  <text x="460" y="67" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#6B6B6B" text-anchor="middle">HEAD</text>
  <line x1="473" y1="92" x2="495" y2="92" stroke="#0072B2" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="495" y="80" width="52" height="24" rx="6" fill="#0072B2"/>
  <text x="521" y="96.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main</text>
  <rect x="16" y="196" width="588" height="120" rx="10" fill="#EDF7F2" stroke="#009E73" stroke-width="2"/>
  <text x="310.0" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Working directory</text>
  <rect x="60" y="236" width="210" height="66" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="70" y="255" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="start">mars.txt</text>
  <line x1="60" y1="263" x2="270" y2="263" stroke="#D0D0D0" stroke-width="1"/>
  <text x="70" y="279" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6B6B6B">Cold and dry, but everything is</text>
  <text x="70" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6B6B6B">my favorite color</text>
  <path d="M140,135 L140,234" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#back)"/>
  <text x="300" y="258" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="start">git restore --source=f22b25e mars.txt</text>
  <text x="300" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B6B6B" text-anchor="start">takes mars.txt as it was in f22b25e</text>
  <text x="300" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B6B6B" text-anchor="start">and puts it in the working directory</text>
</svg>
