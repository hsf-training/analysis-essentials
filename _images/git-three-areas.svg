<svg xmlns="http://www.w3.org/2000/svg" width="860" height="335" viewBox="0 0 860 335" role="img">
  <title>How changes move between the working directory, the staging area and the repository</title>
  <desc>Three areas side by side: the working directory, where you edit files; the staging area, which holds the changes for the next commit; and the repository, which stores the commits. Moving forward: git add copies changes from the working directory to the staging area, and git commit records the staged changes as a new commit in the repository. Going back: git restore file discards changes in the working directory, using the version in the staging area; git restore --staged file unstages changes, using the version in the last commit; and git restore --source=commit file brings back a file as it was in an earlier commit.</desc>
  <rect width="860" height="335" fill="#FFFFFF"/>
  <defs><marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#444444"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D55E00"/></marker></defs>
  <rect x="20" y="40" width="180" height="190" rx="10" fill="#EDF7F2" stroke="#009E73" stroke-width="2"/>
  <text x="110.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Working directory</text>
  <rect x="340" y="40" width="180" height="190" rx="10" fill="#FDF4E3" stroke="#E69F00" stroke-width="2"/>
  <text x="430.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Staging area</text>
  <rect x="660" y="40" width="180" height="190" rx="10" fill="#EEF5FB" stroke="#0072B2" stroke-width="2"/>
  <text x="750.0" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Repository (.git)</text>
  <text x="110.0" y="84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="middle">where you edit files</text>
  <text x="430.0" y="84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="middle">the next commit</text>
  <text x="750.0" y="84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="middle">all your commits</text>
  <rect x="50" y="110" width="120" height="50" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="60" y="129" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="start">mars.txt</text>
  <line x1="50" y1="137" x2="170" y2="137" stroke="#D0D0D0" stroke-width="1"/>
  <text x="60" y="153" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6B6B6B">(edited)</text>
  <rect x="370" y="110" width="120" height="50" rx="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="380" y="129" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1A1A1A" text-anchor="start">mars.txt</text>
  <line x1="370" y1="137" x2="490" y2="137" stroke="#D0D0D0" stroke-width="1"/>
  <text x="380" y="153" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#6B6B6B">(staged)</text>
  <circle cx="700" cy="150" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="713" y1="150" x2="737" y2="150" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="750" cy="150" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <line x1="763" y1="150" x2="787" y2="150" stroke="#9A9A9A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="800" cy="150" r="13" fill="#F2F2F2" stroke="#666666" stroke-width="2"/>
  <text x="800" y="183" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="middle">HEAD</text>
  <path d="M208,112 L330,112" fill="none" stroke="#444444" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#fwd)"/>
  <text x="270.0" y="102" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#444444" text-anchor="middle">git add</text>
  <path d="M528,112 L650,112" fill="none" stroke="#444444" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#fwd)"/>
  <text x="590.0" y="102" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#444444" text-anchor="middle">git commit</text>
  <path d="M332,190 L210,190" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#back)"/>
  <text x="270.0" y="159" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="middle">git restore</text>
  <text x="270.0" y="175" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="middle">&lt;file&gt;</text>
  <path d="M652,190 L530,190" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#back)"/>
  <text x="590.0" y="159" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="middle">git restore</text>
  <text x="590.0" y="175" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="middle">--staged &lt;file&gt;</text>
  <path d="M750.0,236 L750.0,272 L110.0,272 L110.0,240" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#back)"/>
  <text x="430.0" y="294" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#D55E00" text-anchor="middle">git restore --source=&lt;commit&gt; &lt;file&gt;</text>
  <text x="430.0" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="middle">get a file back as it was in an earlier commit</text>
  <line x1="20" y1="16" x2="44" y2="16" stroke="#444444" stroke-width="2.5"/>
  <text x="50" y="20" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="start">saving your work</text>
  <line x1="170" y1="16" x2="194" y2="16" stroke="#D55E00" stroke-width="2.5"/>
  <text x="200" y="20" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B6B6B" text-anchor="start">going back</text>
</svg>
