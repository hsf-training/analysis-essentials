ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: check-merge-conflict
        exclude: ^git/12-conflict\.md$
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: fix-byte-order-marker
      - id: check-ast
      - id: end-of-file-fixer
        exclude: &data ^(shell/data-shell|shell-extras/Material|snakemake/code|git/files)/
      - id: mixed-line-ending
        exclude: *data
      - id: trailing-whitespace
        exclude: *data

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["-I", "codespell.txt"]
        exclude: ^(shell/data-shell|shell-extras/Material|snakemake/code|git/files)/|\.ipynbBKP$

  # Notebook formatting
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-isort
        additional_dependencies: [ isort ]

      - id: nbqa-pyupgrade
        additional_dependencies: [ pyupgrade ]
        args: [ --py39-plus ]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [ --extra-keys=metadata.language_info.codemirror_mode.version metadata.kernelspec metadata.language_info.pygments_lexer metadata.language_info.version ]


